<style>
:root{--bg:#eef1f4;--surface:#fff;--ink:#14202b;--mute:#5b6874;--line:#d3dae1;--accent:#f2b705;--accent-ink:#14202b;--ok:#1e7b4f;--okbg:#e2f3ea;--bad:#c23b2e;--badbg:#fbe7e4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171e;--surface:#18222c;--ink:#eaf0f5;--mute:#93a2af;--line:#2c3945;--ok:#5cc58f;--okbg:#17352a;--bad:#ef7b6f;--badbg:#3a1f1c}}
:root[data-theme="dark"]{--bg:#10171e;--surface:#18222c;--ink:#eaf0f5;--mute:#93a2af;--line:#2c3945;--ok:#5cc58f;--okbg:#17352a;--bad:#ef7b6f;--badbg:#3a1f1c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo","Segoe UI",system-ui,sans-serif;font-stretch:90%;line-height:1.45}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:clamp(28px,6vw,40px);line-height:1.05;margin:8px 0 6px;font-weight:800;font-stretch:78%;letter-spacing:.2px}
.sub{color:var(--mute);margin:0 0 22px}
.stripe{height:10px;border-radius:2px;background:repeating-linear-gradient(-45deg,var(--accent) 0 14px,var(--ink) 14px 28px);margin-bottom:14px}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid{display:grid;gap:10px}
.mod{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;width:100%;padding:14px 16px;background:var(--surface);border:2px solid var(--line);border-radius:6px;color:inherit}
.mod:hover{border-color:var(--ink)}
.mod b{font-size:18px;font-weight:700}
.mod small{color:var(--mute)}
.mod .pct{font-size:22px;font-weight:800;font-stretch:78%;grid-row:1/3;grid-column:2}
.bar{grid-column:1/3;height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.card{background:var(--surface);border:2px solid var(--line);border-radius:6px;padding:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;color:var(--mute);font-size:15px}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;padding:6px 0;font-weight:600}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--ink);transition:width .25s}
.q{font-size:clamp(19px,4.5vw,23px);font-weight:700;line-height:1.3;margin:0 0 16px}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;text-align:left;width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:6px;background:var(--surface);color:inherit}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.opt.no .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default;color:inherit}
.next{margin-top:16px;width:100%;padding:14px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:17px}
.big{font-size:clamp(56px,16vw,92px);font-weight:800;font-stretch:75%;line-height:1;margin:6px 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row span:last-child{font-weight:700;white-space:nowrap}
.btns{display:grid;gap:10px;margin-top:18px}
.btn2{padding:13px;border:2px solid var(--ink);border-radius:6px;background:none;color:var(--ink);font-weight:700}
.final{border-color:var(--accent);margin-bottom:16px}
.note{color:var(--mute);font-size:14px;margin-top:14px}
</style>
</head>

  cur = null;
  let tr = 0, td = 0;
  const cards = modules.map((_, m) => { const s = stat(m); tr += s.r; td += s.d; return `<button class="mod" data-m="${m}"><b>${m + 1}-modul</b><span class="pct">${s.d ? pct(s.r, s.d) + "%" : "—"}</span><small>${s.d} / ${s.n} savol ishlangan</small><span class="bar"><i style="width:${s.d * 100 / s.n}%"></i></span></button>`; }).join("");
  const fin = allDone() ? `<button class="mod final" data-final="1"><b>Yakuniy natijani ko'rish</b><span class="pct">${pct(tr, DATA.length)}%</span><small>Barcha ${DATA.length} ta savol ishlangan</small></button>` : "";
  $.innerHTML = `<div class="stripe"></div><h1>Mehnat muhofazasi va texnika xavfsizligi</h1><p class="sub">${DATA.length} ta savol, ${modules.length} ta modul. Savollar va variantlar tartibi sahifa yangilanganda har safar o'zgaradi.</p>${fin}<div class="grid">${cards}</div><p class="note">Natijalar shu brauzerda saqlanadi.</p><div class="btns"><button class="btn2" id="reset">Hammasini boshidan boshlash</button></div>`;
  $.querySelectorAll("[data-m]").forEach(b => b.onclick = () => openMod(+b.dataset.m));
  const f = $.querySelector("[data-final]"); if (f) f.onclick = final;
  document.getElementById("reset").onclick = () => { if (confirm("Barcha natijalar o'chiriladi. Davom etasizmi?")) { store = {}; save(); home(); } };
  window.scrollTo(0, 0);
}

function openMod(m) {
  const order = shuffle(modules[m]);
  const i = order.findIndex(q => store[q.id] === undefined);
  cur = { m, order, i: i < 0 ? order.length : i, picked: null };
  render();
}

function render() {
  const { m, order, i } = cur;
  if (i >= order.length) return modResult(m);
  const q = order[i];
  if (!cur.opts || cur.opts.q !== q.id) cur.opts = { q: q.id, list: shuffle(q.o.map((t, k) => ({ t, ok: k === 0 }))) };
  const s = stat(m);
  const L = "ABCDE";
  $.innerHTML = `<div class="top"><button class="link" id="back">‹ Modullar</button><span>${m + 1}-modul · ${s.d + 1} / ${s.n}</span></div><div class="prog"><i style="width:${s.d * 100 / s.n}%"></i></div><div class="card"><p class="q">${esc(q.q)}</p><div class="opts">${cur.opts.list.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${L[k]}</span><span>${esc(o.t)}</span></button>`).join("")}</div><div id="nx"></div></div>`;
  document.getElementById("back").onclick = home;
  $.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.k));
  window.scrollTo(0, 0);
}

function pick(k) {
  const q = cur.order[cur.i];
  const list = cur.opts.list;
  const good = list[k].ok;
  store[q.id] = good ? 1 : 0; save();
  $.querySelectorAll(".opt").forEach((b, j) => { b.disabled = true; if (list[j].ok) b.classList.add("ok"); else if (j === k) b.classList.add("no"); });
  const last = cur.i + 1 >= cur.order.length || cur.order.slice(cur.i + 1).every(x => store[x.id] !== undefined);
  const nx = document.getElementById("nx");
  nx.innerHTML = `<button class="next" id="go">${last ? "Modul natijasi" : "Keyingi savol"}</button>`;
  const go = document.getElementById("go");
  go.onclick = () => { cur.i = cur.order.findIndex((x, idx) => idx > cur.i && store[x.id] === undefined); if (cur.i < 0) cur.i = cur.order.length; cur.opts = null; render(); };
  go.focus();
}

function modResult(m) {
  const s = stat(m);
  const next = modules.findIndex((_, x) => stat(x).d < stat(x).n);
  $.innerHTML = `<div class="stripe"></div><div class="card"><p class="sub" style="margin:0">${m + 1}-modul natijasi</p><div class="big">${pct(s.r, s.n)}%</div><p style="margin:0 0 8px">${s.n} ta savoldan ${s.r} tasi to'g'ri</p><div class="btns"><button class="next" id="a">${allDone() ? "Yakuniy natijani ko'rish" : next >= 0 ? (next + 1) + "-modulga o'tish" : "Modullar"}</button><button class="btn2" id="b">Bu modulni qayta ishlash</button><button class="btn2" id="c">Modullar ro'yxati</button></div></div>`;
  document.getElementById("a").onclick = () => allDone() ? final() : next >= 0 ? openMod(next) : home();
  document.getElementById("b").onclick = () => { modules[m].forEach(q => delete store[q.id]); save(); openMod(m); };
  document.getElementById("c").onclick = home;
  window.scrollTo(0, 0);
}

function final() {
  let tr = 0;
  const rows = modules.map((_, m) => { const s = stat(m); tr += s.r; return `<div class="row"><span>${m + 1}-modul (${s.n} ta savol)</span><span>${s.r} / ${s.n} · ${pct(s.r, s.n)}%</span></div>`; }).join("");
  $.innerHTML = `<div class="stripe"></div><div class="card final"><p class="sub" style="margin:0">Yakuniy natija</p><div class="big">${pct(tr, DATA.length)}%</div><p style="margin:0 0 12px">${DATA.length} ta savoldan ${tr} tasi to'g'ri ishlandi</p>${rows}<div class="btns"><button class="next" id="r">Hammasini boshidan boshlash</button><button class="btn2" id="h">Modullar ro'yxati</button></div></div>`;
  document.getElementById("r").onclick = () => { store = {}; save(); home(); };
  document.getElementById("h").onclick = home;
  window.scrollTo(0, 0);
}
home();
</script>
</body>
</html>
